name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: recruit
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx prisma generate

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create Postgres roles
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -d recruit <<'SQL'
          DO $$ BEGIN
            CREATE ROLE app_auth NOINHERIT LOGIN PASSWORD 'auth' BYPASSRLS;
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $$;
          DO $$ BEGIN
            CREATE ROLE app_tenant NOINHERIT LOGIN PASSWORD 'tenant';
          EXCEPTION WHEN duplicate_object THEN NULL;
          END $$;
          GRANT USAGE ON SCHEMA public TO app_auth, app_tenant;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO app_auth;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_tenant;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO app_auth, app_tenant;
          SQL

      # No baseline migration exists (Sessions 00–04 applied outside migrate history).
      # db push materializes schema.prisma; then apply RLS policy SQL.
      - name: Push schema
        run: npx prisma db push --accept-data-loss --skip-generate
        env:
          DATABASE_URL: postgres://postgres:dev@localhost:5432/recruit
          DIRECT_URL: postgres://postgres:dev@localhost:5432/recruit


      - name: Apply audit integrity rules
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -d recruit -v ON_ERROR_STOP=1 \
            -f prisma/migrations/20261008160000_session_29_security/migration.sql

      - name: Apply RLS policies
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -d recruit -v ON_ERROR_STOP=1 \
            -f prisma/migrations/20261005180000_session_05_rls/migration.sql
          PGPASSWORD=dev psql -h localhost -U postgres -d recruit -v ON_ERROR_STOP=1 <<'SQL'
          ALTER TABLE "Task" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "Task";
          CREATE POLICY tenant_isolation ON "Task"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "ComplianceTemplate" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "ComplianceTemplate";
          CREATE POLICY tenant_isolation ON "ComplianceTemplate"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "ComplianceStepTemplate" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "ComplianceStepTemplate";
          CREATE POLICY tenant_isolation ON "ComplianceStepTemplate"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "ComplianceCase" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "ComplianceCase";
          CREATE POLICY tenant_isolation ON "ComplianceCase"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "ChecklistInstance" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "ChecklistInstance";
          CREATE POLICY tenant_isolation ON "ChecklistInstance"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "Document" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "Document";
          CREATE POLICY tenant_isolation ON "Document"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "Notification" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "Notification";
          CREATE POLICY tenant_isolation ON "Notification"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "TenantEmailConfig" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "TenantEmailConfig";
          CREATE POLICY tenant_isolation ON "TenantEmailConfig"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "TenantStorageConnection" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "TenantStorageConnection";
          CREATE POLICY tenant_isolation ON "TenantStorageConnection"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "DocumentSyncState" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "DocumentSyncState";
          CREATE POLICY tenant_isolation ON "DocumentSyncState"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "TenantConnectorConfig" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "TenantConnectorConfig";
          CREATE POLICY tenant_isolation ON "TenantConnectorConfig"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "ConnectorCheck" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "ConnectorCheck";
          CREATE POLICY tenant_isolation ON "ConnectorCheck"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "ConnectorCheckLog" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "ConnectorCheckLog";
          CREATE POLICY tenant_isolation ON "ConnectorCheckLog"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "UserCalendarConnection" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "UserCalendarConnection";
          CREATE POLICY tenant_isolation ON "UserCalendarConnection"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "ScheduledEvent" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "ScheduledEvent";
          CREATE POLICY tenant_isolation ON "ScheduledEvent"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "TenantSmsQuota" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "TenantSmsQuota";
          CREATE POLICY tenant_isolation ON "TenantSmsQuota"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "JobOrder" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "JobOrder";
          CREATE POLICY tenant_isolation ON "JobOrder"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          ALTER TABLE "ClientCandidateComment" ENABLE ROW LEVEL SECURITY;
          DROP POLICY IF EXISTS tenant_isolation ON "ClientCandidateComment";
          CREATE POLICY tenant_isolation ON "ClientCandidateComment"
            USING ("tenantId" = current_setting('app.tenant_id', true))
            WITH CHECK ("tenantId" = current_setting('app.tenant_id', true));
          SQL

      - name: Apply candidate auth RLS
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -d recruit -v ON_ERROR_STOP=1 \
            -f prisma/migrations/20261008140000_session_26_candidate_portal/migration.sql

      - name: Apply branding index
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -d recruit -v ON_ERROR_STOP=1 \
            -f prisma/migrations/20261008150000_session_27_branding/migration.sql

      - name: Apply user scope constraint
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -d recruit -v ON_ERROR_STOP=1 \
            -f prisma/migrations/20261008130000_session_25b_user_scope_constraint/migration.sql

      - name: Grant on tables
        run: |
          PGPASSWORD=dev psql -h localhost -U postgres -d recruit <<'SQL'
          GRANT ALL ON ALL TABLES IN SCHEMA public TO app_auth;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_tenant;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_auth, app_tenant;
          SQL

      - name: typecheck (log only)
        run: npx tsc --noEmit
        continue-on-error: true
      - name: typecheck (exit if errors)
        run: npx tsc --noEmit
      - name: Check for physical Tailwind properties
        run: |
          if grep -RIn -E '\b(ml|mr|pl|pr)-|text-left|text-right' src/app src/components --include='*.tsx'; then
            echo "Use logical properties for RTL"
            exit 1
          fi

      - name: vitest
        run: npx vitest run
        env:
          DATABASE_URL: postgres://app_tenant:tenant@localhost:5432/recruit
          AUTH_DATABASE_URL: postgres://app_auth:auth@localhost:5432/recruit
          DIRECT_URL: postgres://postgres:dev@localhost:5432/recruit
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BLIND_INDEX_KEY: BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
          CANDIDATE_SESSION_SECRET: CCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCCC=
          ROOT_DOMAIN: example.com
          NODE_ENV: test
